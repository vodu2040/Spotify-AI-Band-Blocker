name: Refresh Zoundhub scores

on:
  schedule:
    - cron: "17 5 * * *"   # daily, after Zoundhub's 24-hour update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps

      - name: Download Zoundhub list
        run: |
          set -euo pipefail
          mkdir -p data

          xvfb-run python3 - << 'EOF'
          import json
          import time
          from playwright.sync_api import sync_playwright
          from playwright_stealth import stealth

          url = "https://zoundhub.com/api/artists/all"

          with sync_playwright() as p:
              # Run headful under virtual display (xvfb)
              browser = p.chromium.launch(headless=False)
              context = browser.new_context(
                  viewport={"width": 1920, "height": 1080},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              stealth(page)

              print("Navigating to URL...")
              page.goto(url, wait_until="domcontentloaded", timeout=60000)

              # Wait up to 30 seconds for Cloudflare challenge to clear
              for _ in range(30):
                  title = page.title()
                  print(f"Current page title: {title}")
                  if "Just a moment" not in title:
                      break
                  time.sleep(1)

              time.sleep(2)

              # Extract the raw response text from the rendered page
              raw_content = page.locator("body").inner_text()
              data = json.loads(raw_content)

              assert isinstance(data, list) and len(data) > 1000, f"Unexpected payload: {str(data)[:200]}"

              with open("data/zoundhub-scores.json", "w", encoding="utf-8") as f:
                  json.dump(data, f)

              print("Successfully saved data/zoundhub-scores.json")
              browser.close()
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zoundhub-scores.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh Zoundhub scores"
            git push
          fi
