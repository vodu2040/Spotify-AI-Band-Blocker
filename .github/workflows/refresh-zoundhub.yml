name: Refresh Zoundhub scores

on:
  schedule:
    - cron: "17 5 * * *"   # daily, after Zoundhub's 24-hour update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Zoundhub list
        run: |
          set -euo pipefail
          mkdir -p data
          pip install curl_cffi

          python3 - << 'EOF'
          from curl_cffi import requests
          import json

          url = "https://zoundhub.com/api/artists/all"
          response = requests.get(url, impersonate="chrome124", timeout=30)

          if response.status_code != 200:
              raise SystemExit(f"Request failed with HTTP {response.status_code}: {response.text[:200]}")

          data = response.json()
          assert isinstance(data, list) and len(data) > 1000, "Unexpected payload format or length"

          with open("data/zoundhub-scores.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zoundhub-scores.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh Zoundhub scores"
            git push
          fi
