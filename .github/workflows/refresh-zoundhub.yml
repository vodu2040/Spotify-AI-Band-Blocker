name: Refresh Zoundhub scores

on:
  schedule:
    - cron: "17 5 * * *"   # daily, after Zoundhub's 24-hour update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright

      - name: Download Zoundhub list
        run: |
          set -euo pipefail
          mkdir -p data

          xvfb-run --auto-servernum python3 - << 'EOF'
          import json
          import time
          from playwright.sync_api import sync_playwright

          captured_payload = None
          seen_urls = []

          def handle_response(response):
              global captured_payload
              url = response.url
              ct = response.headers.get("content-type", "")
              if "zoundhub.com" in url and ("json" in ct or "/api/" in url):
                  seen_urls.append(f"{response.status} {ct} -> {url}")
                  if response.status == 200 and "json" in ct:
                      try:
                          body = response.json()
                          if isinstance(body, list) and len(body) > 1000:
                              captured_payload = body
                          elif isinstance(body, dict):
                              for val in body.values():
                                  if isinstance(val, list) and len(val) > 1000:
                                      captured_payload = val
                                      break
                      except Exception:
                          pass

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  channel="chrome",
                  headless=False,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-dev-shm-usage"
                  ],
                  ignore_default_args=["--enable-automation"]
              )

              context = browser.new_context(
                  viewport={"width": 1920, "height": 1080}
              )

              page = context.new_page()
              page.add_init_script("Object.defineProperty(navigator, 'webdriver', { get: () => undefined });")
              page.on("response", handle_response)

              print("Loading Zoundhub homepage...")
              page.goto("https://zoundhub.com/", wait_until="networkidle", timeout=60000)
              time.sleep(3)

              links = page.eval_on_selector_all("a[href]", "els => [...new Set(els.map(e => e.href))]")
              print("Discovered site links:", links)

              if not captured_payload:
                  for link in links:
                      if any(k in link.lower() for k in ["artist", "list", "database", "explore", "browse"]):
                          print(f"Navigating to {link}...")
                          page.goto(link, wait_until="networkidle", timeout=60000)
                          time.sleep(3)
                          if captured_payload:
                              break

              print("Intercepted API/JSON requests:")
              for item in seen_urls:
                  print("  ", item)

              if not captured_payload:
                  raise RuntimeError("Could not automatically capture artist list JSON. Check intercepted URLs above.")

              with open("data/zoundhub-scores.json", "w", encoding="utf-8") as f:
                  json.dump(captured_payload, f)

              print(f"Successfully saved {len(captured_payload)} records to data/zoundhub-scores.json")
              browser.close()
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zoundhub-scores.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh Zoundhub scores"
            git push
          fi
